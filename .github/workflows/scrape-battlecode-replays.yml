name: scrape-battlecode-replays

on:
  push:
    paths:
      - ".github/workflows/scrape-battlecode-replays.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Battlecode site
        shell: python
        run: |
          import re, json, urllib.parse, pathlib
          import requests

          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers["User-Agent"] = "Mozilla/5.0 replay-collector/1.0"

          urls = [
              "https://game.battlecode.au/leaderboard",
              "https://game.battlecode.au/teams/119",
              "https://game.battlecode.au/teams/419",
              "https://game.battlecode.au/visualiser?match=766",
          ]

          script_urls = set()
          report = []
          for url in urls:
              try:
                  r = s.get(url, timeout=30)
                  report.append({"url": url, "status": r.status_code, "final_url": r.url, "content_type": r.headers.get("content-type"), "len": len(r.content)})
                  name = re.sub(r"[^A-Za-z0-9._-]+", "_", urllib.parse.urlparse(url).path.strip("/") or "root") + ".html"
                  (out / name).write_bytes(r.content)
                  if "text/html" in (r.headers.get("content-type") or ""):
                      for src in re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']', r.text, re.I):
                          script_urls.add(urllib.parse.urljoin(r.url, src))
                      links = [urllib.parse.urljoin(r.url, h) for h in re.findall(r'<a[^>]+href=["\\\']([^"\\\']+)["\\\']', r.text, re.I)]
                      (out / (name + ".links.txt")).write_text("\n".join(links))
              except Exception as e:
                  report.append({"url": url, "error": repr(e)})

          (out / "report.json").write_text(json.dumps(report, indent=2))
          (out / "scripts.txt").write_text("\n".join(sorted(script_urls)))

          hits = []
          for i, u in enumerate(sorted(script_urls)):
              try:
                  r = s.get(u, timeout=30)
                  txt = r.text
                  (out / f"script_{i:03d}.js").write_text(txt)
                  for pat in [r'[^"\\\']*replay[^"\\\']*', r'[^"\\\']*battle[^"\\\']*', r'/api/[^"\\\']+', r'\\.replay']:
                      for m in re.finditer(pat, txt, re.I):
                          frag = m.group(0)
                          if len(frag) < 800:
                              hits.append({"script": u, "match": frag})
              except Exception as e:
                  hits.append({"script": u, "error": repr(e)})
          (out / "js_hits.json").write_text(json.dumps(hits, indent=2))

          probes = []
          for mid in [766, 767, 722, 485]:
              for tmpl in [
                  "https://game.battlecode.au/api/battles/{}/replay",
                  "https://game.battlecode.au/api/battles/{}",
                  "https://game.battlecode.au/api/replays/{}",
                  "https://game.battlecode.au/replays/{}.replay",
                  "https://game.battlecode.au/replays/{}",
                  "https://game.battlecode.au/battles/{}/replay",
                  "https://game.battlecode.au/replay/{}.replay",
                  "https://game.battlecode.au/api/battle/{}/replay",
                  "https://game.battlecode.au/api/replay/{}",
              ]:
                  u = tmpl.format(mid)
                  try:
                      r = s.get(u, timeout=20, allow_redirects=True)
                      probes.append({"url": u, "status": r.status_code, "final_url": r.url, "type": r.headers.get("content-type"), "len": len(r.content), "disp": r.headers.get("content-disposition")})
                  except Exception as e:
                      probes.append({"url": u, "error": repr(e)})
          (out / "probes.json").write_text(json.dumps(probes, indent=2))
          print(json.dumps(report, indent=2))
          print("SCRIPTS", len(script_urls))
          print("HITS", json.dumps(hits[:100], indent=2))
          print("PROBES", json.dumps(probes, indent=2))

      - uses: actions/upload-artifact@v4
        with:
          name: battlecode-inspection
          path: out/
